<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="12">
  <style>
    .bg { fill: #fafaf7; }
    .frame { fill: #ffffff; stroke: #5a6b66; stroke-width: 1; }
    .stage { fill: #f3f6f4; stroke: #5a6b66; stroke-width: 1; }
    .accent { fill: #6f9991; }
    .grade-a { fill: #fbece8; stroke: #b25a4a; stroke-width: 1; }
    .grade-h { fill: #fff5e6; stroke: #c08552; stroke-width: 1; }
    .grade-g { fill: #eef2ef; stroke: #6f9991; stroke-width: 1; }
    .grade-e { fill: #e4f0ec; stroke: #4d8577; stroke-width: 1; }
    .text { fill: #1a2421; }
    .muted { fill: #5a6b66; }
    .arrow { stroke: #5a6b66; stroke-width: 1; fill: none; }
  </style>
  <rect class="bg" width="800" height="420"/>

  <text class="text" x="24" y="28" font-size="14" font-weight="600">FSRS 评分 → 状态更新 → 再调度闭环</text>
  <text class="muted" x="360" y="28" font-size="11">FSRS-6 · 21 参数 · 本地计算</text>

  <!-- Loop -->
  <g transform="translate(24, 60)">
    <g transform="translate(0, 0)">
      <rect class="stage" width="180" height="60" rx="4"/>
      <rect class="accent" width="3" height="60"/>
      <text class="text" x="12" y="22" font-weight="600">出题</text>
      <text class="muted" x="12" y="40">按 due 排序取队首</text>
    </g>
    <g transform="translate(220, 0)">
      <rect class="stage" width="180" height="60" rx="4"/>
      <rect class="accent" width="3" height="60"/>
      <text class="text" x="12" y="22" font-weight="600">评分 1–5</text>
      <text class="muted" x="12" y="40">映射 Again/Hard/Good/Easy</text>
    </g>
    <g transform="translate(440, 0)">
      <rect class="stage" width="180" height="60" rx="4"/>
      <rect class="accent" width="3" height="60"/>
      <text class="text" x="12" y="22" font-weight="600">更新 D / S / R</text>
      <text class="muted" x="12" y="40">难度 · 稳定度 · 可提取性</text>
    </g>
    <g transform="translate(660, 0)">
      <rect class="stage" width="116" height="60" rx="4"/>
      <rect class="accent" width="3" height="60"/>
      <text class="text" x="12" y="22" font-weight="600">定下次 due</text>
      <text class="muted" x="12" y="40">回到队列</text>
    </g>

    <path class="arrow" d="M 180 30 L 220 30"/>
    <polygon points="216,26 220,30 216,34" fill="#5a6b66"/>
    <path class="arrow" d="M 400 30 L 440 30"/>
    <polygon points="436,26 440,30 436,34" fill="#5a6b66"/>
    <path class="arrow" d="M 620 30 L 660 30"/>
    <polygon points="656,26 660,30 656,34" fill="#5a6b66"/>
    <path class="arrow" d="M 718 60 L 718 96 L 90 96 L 90 60"/>
    <polygon points="86,64 90,58 94,64" fill="#5a6b66"/>
  </g>

  <!-- Grade mapping -->
  <g transform="translate(24, 152)">
    <rect class="frame" width="368" height="200" rx="4"/>
    <text class="text" x="14" y="22" font-size="12" font-weight="600">评分映射</text>
    <line x1="14" y1="30" x2="354" y2="30" stroke="#5a6b66" stroke-width="0.4"/>

    <g transform="translate(14, 42)">
      <rect class="grade-a" width="340" height="32" rx="2"/>
      <text class="text" x="12" y="20">≤ 2 → Again</text>
      <text class="muted" x="320" y="20" text-anchor="end">当日重出</text>
    </g>
    <g transform="translate(14, 82)">
      <rect class="grade-h" width="340" height="32" rx="2"/>
      <text class="text" x="12" y="20">3 → Hard</text>
      <text class="muted" x="320" y="20" text-anchor="end">短间隔</text>
    </g>
    <g transform="translate(14, 122)">
      <rect class="grade-g" width="340" height="32" rx="2"/>
      <text class="text" x="12" y="20">4 → Good</text>
      <text class="muted" x="320" y="20" text-anchor="end">标准间隔</text>
    </g>
    <g transform="translate(14, 162)">
      <rect class="grade-e" width="340" height="32" rx="2"/>
      <text class="text" x="12" y="20">≥ 5 → Easy</text>
      <text class="muted" x="320" y="20" text-anchor="end">长间隔</text>
    </g>
  </g>

  <!-- Parameters -->
  <g transform="translate(408, 152)">
    <rect class="frame" width="368" height="200" rx="4"/>
    <text class="text" x="14" y="22" font-size="12" font-weight="600">关键参数（默认值）</text>
    <line x1="14" y1="30" x2="354" y2="30" stroke="#5a6b66" stroke-width="0.4"/>

    <text class="muted" x="14" y="52">目标保留率  desired retention = 0.9</text>
    <text class="muted" x="14" y="72">可接受区间  0.8 – 0.95</text>
    <text class="muted" x="14" y="92">最大间隔    730 天</text>
    <text class="muted" x="14" y="112">learning 步长 10 min</text>
    <text class="muted" x="14" y="132">评分档位    4（Again / Hard / Good / Easy）</text>
    <text class="muted" x="14" y="162">评分以事务写入：评分记录 + 调度状态</text>
    <text class="muted" x="14" y="180">同成功同失败，不留半写</text>
  </g>

  <text class="muted" x="24" y="408">图 — FSRS 闭环：评分映射四档，状态三元组 (D, S, R) 决定下一次到期</text>
</svg>
