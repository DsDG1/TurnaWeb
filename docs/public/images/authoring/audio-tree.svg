<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="12">
  <style>
    .bg { fill: #fafaf7; }
    .frame { fill: #ffffff; stroke: #5a6b66; stroke-width: 1; }
    .folder { fill: #eef2ef; stroke: #5a6b66; stroke-width: 1; }
    .file { fill: #ffffff; stroke: #5a6b66; stroke-width: 1; }
    .accent { fill: #6f9991; }
    .warn { fill: #fff5e6; stroke: #c08552; stroke-width: 1; }
    .err { fill: #fbece8; stroke: #b25a4a; stroke-width: 1; }
    .text { fill: #1a2421; }
    .muted { fill: #5a6b66; }
  </style>
  <rect class="bg" width="760" height="460"/>

  <text class="text" x="24" y="28" font-size="14" font-weight="600">音频资产目录与 manifest 校验</text>

  <!-- Tree -->
  <g transform="translate(24, 56)">
    <text class="text" x="0" y="14" font-weight="600">assets/sounds/turkish/</text>

    <g transform="translate(0, 36)">
      <rect class="folder" width="14" height="14" rx="2"/>
      <text class="text" x="22" y="11">listening/</text>
      <text class="muted" x="150" y="11">具名听力素材（生成或人工录音，平铺）</text>
    </g>
    <g transform="translate(32, 64)">
      <rect class="file" width="14" height="14" rx="2"/>
      <text class="text" x="22" y="11">s1-dialogue-a.mp3</text>
      <text class="muted" x="180" y="11">audioAsset = s1-dialogue-a</text>
    </g>
    <g transform="translate(32, 88)">
      <rect class="file" width="14" height="14" rx="2"/>
      <text class="text" x="22" y="11">s2-dialogue-b.mp3</text>
    </g>

    <g transform="translate(0, 116)">
      <rect class="folder" width="14" height="14" rx="2"/>
      <text class="text" x="22" y="11">listening/bgm/</text>
      <text class="muted" x="150" y="11">混音用背景音素材池</text>
    </g>
    <g transform="translate(32, 144)">
      <rect class="file" width="14" height="14" rx="2"/>
      <text class="text" x="22" y="11">bgmA.mp3 · bgmB.mp3 · bgmC.mp3</text>
    </g>

    <g transform="translate(0, 172)">
      <rect class="folder" width="14" height="14" rx="2"/>
      <text class="text" x="22" y="11">listening/debut/</text>
      <text class="muted" x="150" y="11">混音用开场素材池</text>
    </g>
    <g transform="translate(32, 200)">
      <rect class="file" width="14" height="14" rx="2"/>
      <text class="text" x="22" y="11">debutA.mp3 · debutB.mp3 · debutC.mp3</text>
    </g>

    <g transform="translate(0, 228)">
      <rect class="folder" width="14" height="14" rx="2"/>
      <text class="text" x="22" y="11">listening/fin/</text>
      <text class="muted" x="150" y="11">混音用收束素材池</text>
    </g>
    <g transform="translate(32, 256)">
      <rect class="file" width="14" height="14" rx="2"/>
      <text class="text" x="22" y="11">finA.mp3 · finB.mp3 · finC.mp3</text>
    </g>

    <g transform="translate(0, 288)">
      <text class="muted" x="0" y="11">词/表达 id（w-…）→ 运行时 TTS，不落盘</text>
    </g>
    <g transform="translate(0, 312)">
      <text class="muted" x="0" y="11">anki:// 前缀 → 应用内 Anki 媒体目录，不参与 manifest</text>
    </g>
  </g>

  <!-- Side panel: spec -->
  <g transform="translate(420, 56)">
    <rect class="frame" width="316" height="200" rx="4"/>
    <text class="text" x="14" y="22" font-size="12" font-weight="600">格式规范</text>
    <line x1="14" y1="30" x2="302" y2="30" stroke="#5a6b66" stroke-width="0.4"/>

    <text class="muted" x="14" y="52">容器  MP3</text>
    <text class="muted" x="14" y="70">采样率  44.1 kHz</text>
    <text class="muted" x="14" y="88">声道  单声道优先</text>
    <text class="muted" x="14" y="106">比特率  ≥ 128 kbps</text>
    <text class="muted" x="14" y="124">前后静音  ≤ 0.3 s</text>
    <text class="muted" x="14" y="142">true peak  ≤ -1 dBTP</text>
    <text class="muted" x="14" y="160">响度差  ≤ 2 LUFS</text>
    <text class="muted" x="14" y="178">SNR  ≥ 40 dB</text>
  </g>

  <!-- Side panel: manifest -->
  <g transform="translate(420, 272)">
    <rect class="frame" width="316" height="160" rx="4"/>
    <text class="text" x="14" y="22" font-size="12" font-weight="600">manifest 状态（asset_id · referenced_by）</text>
    <line x1="14" y1="30" x2="302" y2="30" stroke="#5a6b66" stroke-width="0.4"/>

    <g transform="translate(14, 44)">
      <rect class="file" width="280" height="22" rx="2"/>
      <text class="text" x="22" y="14">s1-dialogue-a · section1/s1-u2/s1-l4</text>
      <text class="accent" x="270" y="14" text-anchor="end" font-weight="600">present</text>
    </g>
    <g transform="translate(14, 72)">
      <rect class="file" width="280" height="22" rx="2"/>
      <text class="text" x="22" y="14">s2-dialogue-b · section2/s2-u1/s2-l3</text>
      <text class="accent" x="270" y="14" text-anchor="end" font-weight="600">present</text>
    </g>
    <g transform="translate(14, 100)">
      <rect class="warn" width="280" height="22" rx="2"/>
      <text class="text" x="22" y="14">s5-summary-a · section5/s5-u1/s5-l6</text>
      <text x="270" y="14" text-anchor="end" font-weight="600" fill="#c08552">present · 待替换人工</text>
    </g>
    <g transform="translate(14, 128)">
      <rect class="err" width="280" height="22" rx="2"/>
      <text class="text" x="22" y="14">s8-dialogue-a · section8/s8-u1/s8-l2</text>
      <text x="270" y="14" text-anchor="end" font-weight="600" fill="#b25a4a">missing</text>
    </g>
  </g>

  <text class="muted" x="24" y="452">图 — 具名素材落 listening/ 平铺；bgm/debut/fin 是混音素材池；manifest 只统计具名素材</text>
</svg>
