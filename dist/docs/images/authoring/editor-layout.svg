<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="12">
  <style>
    .bg { fill: #fafaf7; }
    .window { fill: #ffffff; stroke: #1a2421; stroke-width: 1.2; }
    .toolbar { fill: #1a2421; }
    .toolbar-text { fill: #fafaf7; }
    .panel { fill: #f3f6f4; stroke: #5a6b66; stroke-width: 0.8; }
    .panel-active { fill: #eef2ef; stroke: #6f9991; stroke-width: 1.2; }
    .tree { fill: #ffffff; stroke: #5a6b66; stroke-width: 0.8; }
    .statusbar { fill: #1a2421; }
    .statusbar-text { fill: #6f9991; }
    .text { fill: #1a2421; }
    .muted { fill: #5a6b66; }
    .accent { fill: #6f9991; }
    .pill { fill: #6f9991; }
  </style>
  <rect class="bg" width="880" height="540"/>

  <text class="text" x="24" y="28" font-size="14" font-weight="600">Turna GUI 主界面布局</text>

  <!-- Window -->
  <g transform="translate(24, 48)">
    <rect class="window" width="832" height="456" rx="6"/>

    <!-- Toolbar -->
    <g>
      <rect class="toolbar" width="832" height="40" rx="6"/>
      <rect class="toolbar" y="34" width="832" height="6"/>
      <text class="toolbar-text" x="20" y="25" font-weight="600">Turna Course Editor</text>

      <g transform="translate(160, 10)">
        <rect class="toolbar" stroke="#5a6b66" stroke-width="0.6" width="80" height="22" rx="3"/>
        <text class="toolbar-text" x="40" y="15" text-anchor="middle">课程仓库</text>
      </g>
      <g transform="translate(248, 10)">
        <rect class="toolbar" stroke="#5a6b66" stroke-width="0.6" width="60" height="22" rx="3"/>
        <text class="toolbar-text" x="30" y="15" text-anchor="middle">保存</text>
      </g>
      <g transform="translate(316, 10)">
        <rect class="pill" width="80" height="22" rx="3"/>
        <text class="toolbar-text" x="40" y="15" text-anchor="middle" font-weight="600">课程工坊</text>
      </g>
      <g transform="translate(404, 10)">
        <rect class="toolbar" stroke="#5a6b66" stroke-width="0.6" width="60" height="22" rx="3"/>
        <text class="toolbar-text" x="30" y="15" text-anchor="middle">总览</text>
      </g>
      <g transform="translate(472, 10)">
        <rect class="toolbar" stroke="#5a6b66" stroke-width="0.6" width="80" height="22" rx="3"/>
        <text class="toolbar-text" x="40" y="15" text-anchor="middle">资源库</text>
      </g>
      <g transform="translate(560, 10)">
        <rect class="toolbar" stroke="#5a6b66" stroke-width="0.6" width="60" height="22" rx="3"/>
        <text class="toolbar-text" x="30" y="15" text-anchor="middle">发布</text>
      </g>
      <g transform="translate(628, 10)">
        <rect class="toolbar" stroke="#5a6b66" stroke-width="0.6" width="90" height="22" rx="3"/>
        <text class="toolbar-text" x="45" y="15" text-anchor="middle">教师模式</text>
      </g>
      <g transform="translate(726, 10)">
        <rect class="toolbar" stroke="#5a6b66" stroke-width="0.6" width="60" height="22" rx="3"/>
        <text class="toolbar-text" x="30" y="15" text-anchor="middle">设置</text>
      </g>
    </g>

    <!-- Course tree (left) -->
    <g transform="translate(8, 48)">
      <rect class="tree" width="240" height="350"/>
      <text class="text" x="14" y="22" font-weight="600">课程结构树</text>
      <line x1="14" y1="30" x2="226" y2="30" stroke="#5a6b66" stroke-width="0.4"/>

      <g transform="translate(14, 44)">
        <text class="accent" x="0" y="0">▾</text>
        <text class="text" x="14" y="0">s-basics · 基础起步</text>
      </g>
      <g transform="translate(28, 60)">
        <text class="accent" x="0" y="0">▾</text>
        <text class="text" x="14" y="0">u-1 · 问候与介绍</text>
      </g>
      <g transform="translate(42, 76)">
        <rect class="accent" x="-2" y="-9" width="180" height="14"/>
        <text class="toolbar-text" x="2" y="2" font-weight="600">l-…-greetings-intro</text>
      </g>
      <g transform="translate(42, 92)">
        <text class="muted" x="0" y="0">l-…-greetings-practice</text>
      </g>
      <g transform="translate(42, 108)">
        <text class="muted" x="0" y="0">l-…-greetings-listening</text>
      </g>

      <g transform="translate(14, 132)">
        <text class="accent" x="0" y="0">▾</text>
        <text class="text" x="14" y="0">u-2 · 数字与时间</text>
      </g>

      <g transform="translate(14, 156)">
        <text class="muted" x="0" y="0">▸ s-daily · 日常生活</text>
      </g>

      <!-- Context hint -->
      <g transform="translate(14, 220)">
        <rect class="panel" width="212" height="116" rx="3"/>
        <text class="text" x="10" y="18" font-size="11" font-weight="600">右键菜单</text>
        <line x1="10" y1="24" x2="202" y2="24" stroke="#5a6b66" stroke-width="0.4"/>
        <text class="muted" x="10" y="40">· 新增（Section/Unit/Lesson）</text>
        <text class="muted" x="10" y="56">· 套用预设</text>
        <text class="muted" x="10" y="72">· AI 编辑此节点</text>
        <text class="muted" x="10" y="88">· 批量复制 / 移动 / 删除</text>
        <text class="muted" x="10" y="104">F2 重命名 · Ctrl+D 克隆</text>
      </g>
    </g>

    <!-- Detail panel (right) -->
    <g transform="translate(256, 48)">
      <rect class="panel" width="568" height="350"/>
      <text class="text" x="14" y="22" font-weight="600">l-u1-greetings-intro · 元数据 + 蓝图</text>
      <line x1="14" y1="30" x2="554" y2="30" stroke="#5a6b66" stroke-width="0.4"/>

      <!-- Form fields -->
      <g transform="translate(14, 44)">
        <text class="muted" x="0" y="14">name</text>
        <rect class="panel-active" x="80" y="0" width="240" height="20" rx="2"/>
        <text class="text" x="86" y="14">Greetings / Intro</text>

        <text class="muted" x="0" y="38">type</text>
        <rect class="panel-active" x="80" y="24" width="100" height="20" rx="2"/>
        <text class="text" x="86" y="38">normal</text>

        <text class="muted" x="0" y="62">template</text>
        <rect class="pill" x="80" y="48" width="100" height="20" rx="2"/>
        <text class="toolbar-text" x="130" y="62" text-anchor="middle" font-weight="600">intro</text>

        <text class="muted" x="0" y="86">prereq</text>
        <rect class="panel-active" x="80" y="72" width="240" height="20" rx="2"/>
        <text class="text" x="86" y="86">[]</text>
      </g>

      <!-- Blueprint stage -->
      <g transform="translate(14, 152)">
        <text class="text" x="0" y="0" font-size="11" font-weight="600">stages</text>
        <line x1="0" y1="8" x2="540" y2="8" stroke="#5a6b66" stroke-width="0.4"/>

        <g transform="translate(0, 18)">
          <rect class="panel-active" width="160" height="40" rx="3"/>
          <text class="text" x="10" y="18" font-weight="600">st-recognition</text>
          <text class="muted" x="10" y="32">showWord · multipleChoice</text>
        </g>
        <g transform="translate(180, 18)">
          <rect class="panel-active" width="160" height="40" rx="3"/>
          <text class="text" x="10" y="18" font-weight="600">st-meaning</text>
          <text class="muted" x="10" y="32">multipleChoice · fillBlank</text>
        </g>
        <g transform="translate(360, 18)">
          <rect class="panel-active" width="180" height="40" rx="3"/>
          <text class="text" x="10" y="18" font-weight="600">st-consolidation</text>
          <text class="muted" x="10" y="32">typeTheWord · translateSentence</text>
        </g>

        <path class="accent" d="M 160 38 L 180 38" stroke="#6f9991" stroke-width="1.4" fill="none"/>
        <polygon points="176,34 180,38 176,42" fill="#6f9991"/>
        <path class="accent" d="M 340 38 L 360 38" stroke="#6f9991" stroke-width="1.4" fill="none"/>
        <polygon points="356,34 360,38 356,42" fill="#6f9991"/>
      </g>

      <!-- Audit row -->
      <g transform="translate(14, 232)">
        <rect class="panel" width="540" height="100" rx="3"/>
        <text class="text" x="10" y="18" font-size="11" font-weight="600">校验与资源</text>
        <line x1="10" y1="24" x2="530" y2="24" stroke="#5a6b66" stroke-width="0.4"/>
        <text class="muted" x="10" y="42">· wordId → vocab.json (✓ 3 项)</text>
        <text class="muted" x="10" y="58">· expressionId → expressions.json (✓ 0 项)</text>
        <text class="muted" x="10" y="74">· linkedGrammarPointIds → grammar_points (✓ 1 项)</text>
        <text class="muted" x="10" y="90">· audioAsset → assets/sounds/turkish/listening/ (无)</text>
      </g>
    </g>

    <!-- Status bar -->
    <g transform="translate(0, 406)">
      <rect class="statusbar" width="832" height="50" rx="6"/>
      <rect class="statusbar" y="0" width="832" height="6"/>
      <text class="statusbar-text" x="14" y="32" font-weight="600">就绪</text>
      <text class="statusbar-text" x="74" y="32">·</text>
      <text class="statusbar-text" x="86" y="32">校验防护激活中</text>
      <text class="statusbar-text" x="240" y="32">·</text>
      <text class="statusbar-text" x="252" y="32">当前路径：assets/courses/turkish</text>
    </g>
  </g>

  <text class="muted" x="24" y="528">图 7 — 主界面三区：工具栏 / 课程树 / 详情面板 + 状态栏</text>
</svg>
