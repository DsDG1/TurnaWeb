<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="13">
  <style>
    .bg { fill: #fafaf7; }
    .node { fill: #ffffff; stroke: #5a6b66; stroke-width: 1; }
    .node-section { fill: #eef2ef; }
    .node-unit { fill: #f3f6f4; }
    .accent { fill: #6f9991; }
    .text { fill: #1a2421; }
    .muted { fill: #5a6b66; }
    .tag { fill: #6f9991; }
    .edge { stroke: #5a6b66; stroke-width: 1; fill: none; }
  </style>
  <rect class="bg" width="800" height="420"/>

  <text class="text" x="24" y="28" font-size="14" font-weight="600">Section → Unit → Lesson</text>
  <text class="muted" x="220" y="28" font-size="11">稳定 ID · 显示顺序 ≠ 依赖关系</text>

  <!-- Section node -->
  <g transform="translate(40, 64)">
    <rect class="node node-section" width="200" height="60" rx="4"/>
    <rect class="accent" width="3" height="60"/>
    <text class="text" x="14" y="22" font-weight="600">s-basics</text>
    <text class="muted" x="14" y="40">基础起步 · A1</text>
    <text class="muted" x="14" y="54">file: sections/section1.json</text>
  </g>

  <!-- Unit node -->
  <g transform="translate(80, 168)">
    <rect class="node node-unit" width="200" height="60" rx="4"/>
    <rect class="accent" x="0" y="0" width="3" height="60"/>
    <text class="text" x="14" y="22" font-weight="600">u-1</text>
    <text class="muted" x="14" y="40">问候与介绍</text>
    <text class="muted" x="14" y="54">≤ 40 lessons · target ≈ 30</text>
  </g>

  <!-- Edges Section → Unit -->
  <path class="edge" d="M 140 124 L 140 168"/>
  <circle cx="140" cy="124" r="2.5" fill="#5a6b66"/>

  <!-- Lessons -->
  <g transform="translate(120, 264)">
    <rect class="node" width="220" height="38" rx="4"/>
    <rect class="accent" width="3" height="38"/>
    <text class="text" x="14" y="16" font-weight="600">l-u1-greetings-intro</text>
    <text class="tag" x="14" y="30">intro</text>
    <text class="muted" x="60" y="30">· 认识新词</text>
  </g>
  <g transform="translate(120, 312)">
    <rect class="node" width="220" height="38" rx="4"/>
    <rect class="accent" width="3" height="38"/>
    <text class="text" x="14" y="16" font-weight="600">l-u1-greetings-practice</text>
    <text class="tag" x="14" y="30">practice</text>
    <text class="muted" x="68" y="30">· 受控操练</text>
  </g>
  <g transform="translate(120, 360)">
    <rect class="node" width="220" height="38" rx="4"/>
    <rect class="accent" width="3" height="38"/>
    <text class="text" x="14" y="16" font-weight="600">l-u1-greetings-listening</text>
    <text class="tag" x="14" y="30">listening</text>
    <text class="muted" x="76" y="30">· 听力三段</text>
  </g>

  <!-- Edges Unit → Lessons -->
  <path class="edge" d="M 180 228 L 180 248 L 230 248 L 230 264"/>
  <path class="edge" d="M 180 228 L 180 248 L 230 248 L 230 312"/>
  <path class="edge" d="M 180 228 L 180 248 L 230 248 L 230 360"/>
  <circle cx="180" cy="228" r="2.5" fill="#5a6b66"/>

  <!-- Right side: rules -->
  <g transform="translate(380, 64)">
    <rect class="node" width="400" height="316" rx="4"/>
    <text class="text" x="14" y="22" font-size="12" font-weight="600">字段合同（节选）</text>
    <line x1="14" y1="30" x2="386" y2="30" stroke="#5a6b66" stroke-width="0.4"/>

    <text class="text" x="14" y="56">Lesson.id</text>
    <text class="muted" x="120" y="56">全课程稳定 · 发布后不可变</text>

    <text class="text" x="14" y="80">Lesson.type</text>
    <text class="muted" x="120" y="80">normal | listening | reading | review | challenge</text>

    <text class="text" x="14" y="104">Lesson.template</text>
    <text class="muted" x="140" y="104">intro | practice | listening |</text>
    <text class="muted" x="140" y="120">reading | review | mastery | legacy</text>

    <text class="text" x="14" y="148">prerequisiteLessonIds</text>
    <text class="muted" x="180" y="148">同 Unit 内 · 无环 · 不跨 Unit</text>

    <text class="text" x="14" y="172">content</text>
    <text class="muted" x="80" y="172">canonical shape by template</text>

    <text class="text" x="14" y="196" font-size="12" font-weight="600">禁止形状</text>
    <line x1="14" y1="204" x2="386" y2="204" stroke="#5a6b66" stroke-width="0.4"/>

    <text class="muted" x="14" y="226">· 新 Lesson 使用扁平 questions</text>
    <text class="muted" x="14" y="246">· Lesson 内复制整份词表</text>
    <text class="muted" x="14" y="266">· 同 Lesson 内 ID 重复</text>
    <text class="muted" x="14" y="286">· 引用不存在资源 / 音频</text>
    <text class="muted" x="14" y="306">· 跨 Unit / Section 的 prerequisiteLessonIds</text>
  </g>

  <text class="muted" x="24" y="408">图 2 — 三段层级与 Lesson 字段合同</text>
</svg>
