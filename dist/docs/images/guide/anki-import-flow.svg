<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="12">
  <style>
    .bg { fill: #fafaf7; }
    .frame { fill: #ffffff; stroke: #5a6b66; stroke-width: 1; }
    .stage { fill: #f3f6f4; stroke: #5a6b66; stroke-width: 1; }
    .accent { fill: #6f9991; }
    .warn { fill: #fff5e6; stroke: #c08552; stroke-width: 1; }
    .err { fill: #fbece8; stroke: #b25a4a; stroke-width: 1; }
    .text { fill: #1a2421; }
    .muted { fill: #5a6b66; }
    .arrow { stroke: #5a6b66; stroke-width: 1; fill: none; }
  </style>
  <rect class="bg" width="800" height="460"/>

  <text class="text" x="24" y="28" font-size="14" font-weight="600">Anki 导入向导：五步流水线</text>
  <text class="muted" x="300" y="28" font-size="11">Android 生产路径 · 官方优先</text>

  <!-- Steps row -->
  <g transform="translate(24, 60)">
    <g transform="translate(0, 0)">
      <rect class="stage" width="136" height="64" rx="4"/>
      <rect class="accent" width="3" height="64"/>
      <text class="text" x="12" y="20" font-weight="600">1. 选文件</text>
      <text class="muted" x="12" y="38">.apkg</text>
      <text class="muted" x="12" y="54">计划在此冻结</text>
    </g>
    <g transform="translate(156, 0)">
      <rect class="stage" width="136" height="64" rx="4"/>
      <rect class="accent" width="3" height="64"/>
      <text class="text" x="12" y="20" font-weight="600">2. 解析</text>
      <text class="muted" x="12" y="38">notetype 识别</text>
      <text class="muted" x="12" y="54">证据驱动</text>
    </g>
    <g transform="translate(312, 0)">
      <rect class="stage" width="136" height="64" rx="4"/>
      <rect class="accent" width="3" height="64"/>
      <text class="text" x="12" y="20" font-weight="600">3. 预览</text>
      <text class="muted" x="12" y="38">牌组树 / 卡数</text>
      <text class="muted" x="12" y="54">字段映射核对</text>
    </g>
    <g transform="translate(468, 0)">
      <rect class="stage" width="136" height="64" rx="4"/>
      <rect class="accent" width="3" height="64"/>
      <text class="text" x="12" y="20" font-weight="600">4. 执行</text>
      <text class="muted" x="12" y="38">写入 Official</text>
      <text class="muted" x="12" y="54">Collection</text>
    </g>
    <g transform="translate(624, 0)">
      <rect class="stage" width="136" height="64" rx="4"/>
      <rect class="accent" width="3" height="64"/>
      <text class="text" x="12" y="20" font-weight="600">5. 完成</text>
      <text class="muted" x="12" y="38">导入报告</text>
      <text class="muted" x="12" y="54">进入官方复习</text>
    </g>

    <path class="arrow" d="M 136 32 L 156 32"/>
    <polygon points="152,28 156,32 152,36" fill="#5a6b66"/>
    <path class="arrow" d="M 292 32 L 312 32"/>
    <polygon points="308,28 312,32 308,36" fill="#5a6b66"/>
    <path class="arrow" d="M 448 32 L 468 32"/>
    <polygon points="464,28 468,32 464,36" fill="#5a6b66"/>
    <path class="arrow" d="M 604 32 L 624 32"/>
    <polygon points="620,28 624,32 620,36" fill="#5a6b66"/>
  </g>

  <!-- Input boundary -->
  <g transform="translate(24, 156)">
    <rect class="frame" width="368" height="120" rx="4"/>
    <text class="text" x="14" y="22" font-size="12" font-weight="600">输入边界</text>
    <line x1="14" y1="30" x2="354" y2="30" stroke="#5a6b66" stroke-width="0.4"/>

    <g transform="translate(14, 40)">
      <rect class="stage" width="160" height="28" rx="2"/>
      <text class="text" x="12" y="18">.apkg</text>
      <text class="accent" x="150" y="18" text-anchor="end" font-weight="600">支持</text>
    </g>
    <g transform="translate(14, 76)">
      <rect class="warn" width="160" height="28" rx="2"/>
      <text class="text" x="12" y="18">.colpkg</text>
      <text x="150" y="18" text-anchor="end" font-weight="600" fill="#c08552">手动引导</text>
    </g>
    <text class="muted" x="186" y="58">生产导入输入</text>
    <text class="muted" x="186" y="94">提示不支持 + 手动导出指引</text>
  </g>

  <!-- Ownership -->
  <g transform="translate(408, 156)">
    <rect class="frame" width="368" height="120" rx="4"/>
    <text class="text" x="14" y="22" font-size="12" font-weight="600">所有权</text>
    <line x1="14" y1="30" x2="354" y2="30" stroke="#5a6b66" stroke-width="0.4"/>

    <text class="muted" x="14" y="52">· 卡片与排期 → Official Collection / scheduler</text>
    <text class="muted" x="14" y="70">· 默认 withScheduling=false → 以新卡进入复习</text>
    <text class="muted" x="14" y="88">· Turna FSRS 不接管导入卡</text>
    <text class="muted" x="14" y="106">· 旧版 NoteStore / Turna SRS 不同时写入</text>
  </g>

  <!-- Notetype recognition -->
  <g transform="translate(24, 304)">
    <rect class="frame" width="752" height="120" rx="4"/>
    <text class="text" x="14" y="22" font-size="12" font-weight="600">notetype 识别与投影目标（OfficialAnkiProjectionKind）</text>
    <line x1="14" y1="30" x2="738" y2="30" stroke="#5a6b66" stroke-width="0.4"/>

    <text class="muted" x="14" y="52">按 notetype 证据（字段名 / 模板形状 / 卡片数）判定，不按文件名猜</text>
    <text class="text" x="14" y="76">showWord · flip · multipleChoice · multiSelect · listenPick</text>
    <text class="text" x="14" y="94">typeAnswer · fillBlank · translate · canonicalLink</text>
    <text class="muted" x="14" y="110">识别失败 → 保留原始模板渲染（fidelity 路径），不强行套课程题型</text>
  </g>

  <text class="muted" x="24" y="452">图 — 五步向导；执行计划在第 1 步冻结；官方 Collection 持有卡片与调度</text>
</svg>
